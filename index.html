<!doctype html>
<html lang="pt-BR" data-theme="auto">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Rumo ao ANPAD · plano de estudos por módulos</title>
  <meta name="description" content="Plano de estudos para o Teste ANPAD, por módulos, cobrindo todo o conteúdo programático: roteiros, timer, prompts para gerar questões, registro de erros e guia de método.">
  <meta name="theme-color" content="#F2F5FA" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0D1224" media="(prefers-color-scheme: dark)">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Instrument+Sans:wght@400..700&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a class="skip" href="#view">Ir para o conteúdo</a>

  <div class="app">
    <aside class="rail" aria-label="Menu principal">
      <a class="brand" href="#/painel">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-name">Rumo ao ANPAD</span>
      </a>
      <nav class="nav" id="nav-rail" aria-label="Seções"></nav>

      <div class="rail-foot">
        <p class="count" id="count-rail"></p>
        <div class="meter" aria-hidden="true"><i id="meter-rail"></i></div>
        <p class="meter-txt" id="meter-txt"></p>
        <div class="rail-tools">
          <button type="button" class="btn ghost" data-act="settings">Ajustes</button>
          <button type="button" class="btn ghost" data-act="theme" id="theme-btn" aria-label="Alternar tema">Tema</button>
        </div>
      </div>
    </aside>

    <header class="topbar">
      <a class="brand" href="#/painel">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-name">Rumo ao ANPAD</span>
      </a>
      <span class="pill" id="count-top"></span>
      <button type="button" class="icon-btn" data-act="settings" aria-label="Abrir ajustes">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </button>
    </header>

    <main id="view" class="view" tabindex="-1" aria-live="polite"></main>

    <nav class="tabbar" id="nav-tab" aria-label="Seções"></nav>
  </div>

  <div class="dock" id="dock" hidden></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <dialog id="settings" class="modal">
    <form method="dialog" id="settings-form">
      <h2>Ajustes</h2>
      <p class="muted">Tudo fica salvo só neste navegador (localStorage). Nada é enviado para servidor.</p>

      <label class="field">
        <span>Data e hora da prova (opcional)</span>
        <input type="datetime-local" id="set-exam">
        <small>Com a data definida, o app mostra a contagem regressiva e calcula os dias disponíveis. Deixe em branco se não souber. Confirme a data no site oficial do Teste ANPAD.</small>
      </label>

      <label class="field">
        <span>Duração padrão de uma sessão de estudo</span>
        <select id="set-sess">
          <option value="25">25 minutos</option>
          <option value="50">50 minutos</option>
          <option value="60">60 minutos</option>
          <option value="90">90 minutos</option>
        </select>
      </label>

      <label class="field">
        <span>Tema</span>
        <select id="set-theme">
          <option value="auto">Seguir o sistema</option>
          <option value="light">Claro</option>
          <option value="dark">Escuro</option>
        </select>
      </label>

      <div class="field">
        <span>Backup</span>
        <div class="row">
          <button type="button" class="btn" data-act="backup-export">Baixar backup (JSON)</button>
          <label class="btn" for="backup-file">Restaurar backup</label>
          <input type="file" id="backup-file" accept="application/json" hidden>
        </div>
      </div>

      <div class="field">
        <span>Começar uma nova edição</span>
        <div class="row">
          <button type="button" class="btn danger" data-act="reset-progress">Zerar progresso dos módulos</button>
          <button type="button" class="btn danger" data-act="reset-all">Apagar tudo</button>
        </div>
        <small>Zerar o progresso mantém o registro de erros e o placar. Apagar tudo remove também esses dados.</small>
      </div>

      <div class="modal-actions">
        <button type="button" class="btn" data-act="settings-close">Cancelar</button>
        <button type="submit" class="btn primary" value="save">Salvar ajustes</button>
      </div>
    </form>
  </dialog>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
